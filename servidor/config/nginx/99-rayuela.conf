server_tokens off;

limit_req_status 429;
limit_conn_status 429;

limit_req_zone $binary_remote_addr zone=rayuela_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rayuela_login:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=rayuela_conn:10m;

# rutas de escaneo tipicas: se cortan sin respuesta
map $request_uri $rayuela_basura {
    default 0;
    ~*^/\.(env|git|svn|hg|ds_store) 1;
    ~*^/(wp-login|wp-admin|wp-content|wp-includes|xmlrpc|phpmyadmin|pma|myadmin|admin\.php|shell|setup\.php|cgi-bin) 1;
    ~*\.(php|asp|aspx|jsp|cgi)$ 1;
}
